name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./... -count=1 -coverprofile=coverage.out
      - run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "coverage: $total"
          if [ "${total%\%}" -lt 30 ]; then
            echo "coverage below 30%"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: gofmt -l .
      - run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "files not formatted:"
            gofmt -l .
            exit 1
          fi
      - run: go vet ./...
